[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hedge-detector"
version = "0.1.0"
description = "Flag hedging words, weasel phrases and passive-voice constructions in academic prose."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "JANIN A APURBA", email = "japurba97@gmail.com"}]
keywords = ["research", "automation", "reproducibility", "academic"]
dependencies = []

[project.scripts]
hedge-detector = "hedge_detector.cli:main"

[tool.setuptools]
packages = ["hedge_detector"]
